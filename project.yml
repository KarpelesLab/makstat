name: Makstat
options:
  bundleIdPrefix: com.magicaltux
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: BTXR2WSDG9
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "15.0"
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  Makstat:
    type: application
    platform: macOS
    sources:
      - path: Shared
      - path: Makstat
    dependencies:
      - target: MakstatWidget
        embed: true
    settings:
      base:
        PRODUCT_NAME: Makstat
        PRODUCT_BUNDLE_IDENTIFIER: com.magicaltux.makstat
        INFOPLIST_FILE: Makstat/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Makstat/Resources/Makstat.entitlements
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  MakstatWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Shared
      - path: MakstatWidget
    settings:
      base:
        PRODUCT_NAME: MakstatWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.magicaltux.makstat.widget
        INFOPLIST_FILE: MakstatWidget/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: MakstatWidget/Resources/MakstatWidget.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET"

schemes:
  Makstat:
    build:
      targets:
        Makstat: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
