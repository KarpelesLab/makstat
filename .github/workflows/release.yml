name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      # Optional secrets. Without them the build is ad-hoc signed; the in-app updater
      # then only accepts it on copies that are themselves unsigned/ad-hoc.
      #   MACOS_CERTIFICATE_P12       base64 of a "Developer ID Application" .p12
      #   MACOS_CERTIFICATE_PASSWORD  its password
      #   APPLE_TEAM_ID               team of that certificate (defaults to project.yml's)
      #   APPLE_ID / APPLE_APP_PASSWORD  Apple ID + app-specific password for notarization
      HAVE_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
      HAVE_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Import Developer ID certificate
        if: env.HAVE_CERT == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build universal app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "$HAVE_CERT" = "true" ]; then
            SIGN=(CODE_SIGN_IDENTITY="Developer ID Application" "OTHER_CODE_SIGN_FLAGS=--timestamp")
            [ -n "$APPLE_TEAM_ID" ] && SIGN+=("DEVELOPMENT_TEAM=$APPLE_TEAM_ID")
          else
            SIGN=(CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=)
          fi
          xcodebuild -project Makstat.xcodeproj -scheme Makstat -configuration Release \
            -derivedDataPath build/DerivedData \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual "${SIGN[@]}" \
            build 2>&1 | tee build.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
          APP=build/DerivedData/Build/Products/Release/Makstat.app
          echo "app: $(lipo -archs "$APP/Contents/MacOS/Makstat")"
          echo "widget: $(lipo -archs "$APP/Contents/PlugIns/MakstatWidget.appex/Contents/MacOS/MakstatWidget")"
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier=" || true

      - name: Notarize
        if: env.HAVE_CERT == 'true' && env.HAVE_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP=build/DerivedData/Build/Products/Release/Makstat.app
          ditto -c -k --keepParent "$APP" notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" \
            --team-id "${APPLE_TEAM_ID:-BTXR2WSDG9}" --wait
          xcrun stapler staple "$APP"

      - name: Package
        run: |
          APP=build/DerivedData/Build/Products/Release/Makstat.app
          ZIP="Makstat-$VERSION-universal.zip"
          ditto -c -k --keepParent "$APP" "$ZIP"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Makstat $VERSION" --generate-notes
          fi
          gh release upload "$TAG" "$ZIP" "$ZIP.sha256" --clobber
