name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      # Same secrets as KarpelesLab/cterm. Without them the build is ad-hoc signed, and the
      # in-app updater only accepts such builds on copies that are themselves ad-hoc signed.
      #   APPLE_CERTIFICATE_BASE64   base64 of a "Developer ID Application" .p12
      #   APPLE_CERTIFICATE_PASSWORD its password
      #   APPLE_TEAM_ID              team ID of that certificate
      #   APPLE_ID / APPLE_ID_PASSWORD  Apple ID + app-specific password for notarytool
      HAVE_CERT: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
      HAVE_NOTARY: ${{ secrets.APPLE_ID != '' && secrets.APPLE_ID_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      KEYCHAIN_PATH: /tmp/signing.keychain-db
      APP: build/DerivedData/Build/Products/Release/Makstat.app
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install tools
        run: brew install xcodegen create-dmg

      - name: Generate project
        run: xcodegen generate

      - name: Import signing certificate
        if: env.HAVE_CERT == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > /tmp/certificate.p12
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import /tmp/certificate.p12 -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          rm /tmp/certificate.p12
          IDENTITY=$(security find-identity -v -p codesigning | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID Application identity found in keychain"
            security find-identity -v -p codesigning
            exit 1
          fi
          echo "Signing with: $IDENTITY"
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build universal app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "$HAVE_CERT" = "true" ]; then
            SIGN=("CODE_SIGN_IDENTITY=$IDENTITY" "DEVELOPMENT_TEAM=$APPLE_TEAM_ID" "OTHER_CODE_SIGN_FLAGS=--timestamp")
          else
            SIGN=(CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM=)
          fi
          xcodebuild -project Makstat.xcodeproj -scheme Makstat -configuration Release \
            -derivedDataPath build/DerivedData \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual "${SIGN[@]}" \
            build 2>&1 | tee build.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
          echo "app: $(lipo -archs "$APP/Contents/MacOS/Makstat")"
          echo "widget: $(lipo -archs "$APP/Contents/PlugIns/MakstatWidget.appex/Contents/MacOS/MakstatWidget")"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|Signature" || true

      - name: Notarize app bundle
        if: env.HAVE_CERT == 'true' && env.HAVE_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent "$APP" /tmp/makstat-notarize.zip
          xcrun notarytool submit /tmp/makstat-notarize.zip \
            --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m
          xcrun stapler staple "$APP"
          rm /tmp/makstat-notarize.zip

      - name: Package zip (used by the in-app updater)
        run: |
          mkdir -p release
          ditto -c -k --keepParent "$APP" release/Makstat-macos-universal.zip
          (cd release && shasum -a 256 Makstat-macos-universal.zip > Makstat-macos-universal.zip.sha256 && cat Makstat-macos-universal.zip.sha256)

      - name: Create DMG
        run: |
          create-dmg \
            --volname "Makstat $VERSION" \
            --window-pos 200 120 --window-size 600 400 --icon-size 100 \
            --icon "Makstat.app" 150 185 --hide-extension "Makstat.app" \
            --app-drop-link 450 185 \
            release/Makstat-macos-universal.dmg "$APP" || true
          if [ ! -f release/Makstat-macos-universal.dmg ]; then
            mkdir -p /tmp/dmg && cp -R "$APP" /tmp/dmg/ && ln -s /Applications /tmp/dmg/Applications
            hdiutil create -volname "Makstat $VERSION" -srcfolder /tmp/dmg -ov -format UDZO release/Makstat-macos-universal.dmg
          fi

      - name: Sign and notarize DMG
        if: env.HAVE_CERT == 'true' && env.HAVE_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          codesign --force --sign "$IDENTITY" --timestamp release/Makstat-macos-universal.dmg
          xcrun notarytool submit release/Makstat-macos-universal.dmg \
            --apple-id "$APPLE_ID" --password "$APPLE_ID_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 30m
          xcrun stapler staple release/Makstat-macos-universal.dmg

      - name: Clean up keychain
        if: always()
        run: |
          if [ -f "$KEYCHAIN_PATH" ]; then security delete-keychain "$KEYCHAIN_PATH" || true; fi

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Makstat $VERSION" --generate-notes
          fi
          gh release upload "$TAG" release/Makstat-macos-universal.zip release/Makstat-macos-universal.zip.sha256 \
            release/Makstat-macos-universal.dmg --clobber
